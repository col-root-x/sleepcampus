<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Sleeping Campus</title>
<style>
:root{--day:.5;--bg:#070b1a;--t:#eaf0ff;--m:#8d9bc9;--ok:#2ee6a6;--w:#ffb02e;--r:#ff4d6d;--b:#5aa9ff;--v:#9b7bff}
*{box-sizing:border-box}body{margin:0;color:var(--t);font:14px/1.45 -apple-system,"SF Pro Display",system-ui,sans-serif;min-height:100vh;
background:radial-gradient(900px 500px at 12% -10%,rgba(155,123,255,calc(.12 + var(--day)*.12)),transparent),radial-gradient(900px 600px at 92% 0,rgba(90,169,255,calc(.1 + var(--day)*.25)),transparent),var(--bg)}
.g{background:rgba(18,26,56,.62);backdrop-filter:blur(14px);border:1px solid rgba(130,160,255,.16);border-radius:16px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px}h1{margin:0;font-size:17px;letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(90deg,#fff,var(--b),var(--v));-webkit-background-clip:text;color:transparent}
h1 small{display:block;font-size:10px;letter-spacing:.04em;text-transform:none;-webkit-text-fill-color:var(--m)}.sp{flex:1}
button,select{background:rgba(40,56,110,.55);color:var(--t);border:1px solid rgba(130,160,255,.25);border-radius:10px;padding:7px 12px;cursor:pointer;font:inherit;transition:.2s}button:hover{border-color:var(--b);transform:translateY(-1px)}
button.on{background:linear-gradient(135deg,#3b5bdb,#7b4fe0);border-color:transparent}button.go{background:#12684f;border-color:var(--ok)}button.no{background:#6b1f2e;border-color:var(--r)}button.warn{background:#6b4210;border-color:var(--w)}
.chip{padding:3px 10px;border-radius:99px;font-size:11px;border:1px solid}.sim{color:var(--w);border-color:#6b4d12;background:#2c2208}.clk{color:#9fd0ff;border-color:#24508a;background:#0d2342;font-weight:600}
#kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 22px 8px}.k{display:flex;gap:10px;align-items:center}.k small{color:var(--m);font-size:10px;letter-spacing:.08em}.k b{font-size:22px;display:block;line-height:1.1}
nav{display:flex;gap:6px;padding:6px 22px;flex-wrap:wrap}main{padding:6px 22px 40px}.two{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:14px}@media(max-width:1000px){.two{grid-template-columns:1fr}}
.cube{cursor:pointer;transition:filter .3s}.cube:hover{filter:brightness(1.35)}.glow{animation:gl 1.6s infinite}.glow2{filter:drop-shadow(0 0 6px #ffb02e)}@keyframes gl{50%{filter:drop-shadow(0 0 12px #ff4d6d)}}
svg text{fill:var(--m);font:11px sans-serif}.fl{fill:none;stroke:var(--b);stroke-dasharray:6 8;animation:da 1s linear infinite;opacity:.8}@keyframes da{to{stroke-dashoffset:-14}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}.kv span:nth-child(odd){color:var(--m)}.pill{padding:2px 8px;border-radius:99px;font-size:11px}.est{background:#33280a;color:var(--w)}.mea{background:#0b3a2c;color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px 8px;border-bottom:1px solid rgba(130,160,255,.14);text-align:left}tr.cl{cursor:pointer}tr.cl:hover{background:rgba(90,169,255,.1)}
.feed{max-height:230px;overflow:auto}.feed div{padding:4px 0;border-bottom:1px solid rgba(130,160,255,.12);font-size:12px}.conf-t,.rej-t{color:var(--r)}.ok-t{color:var(--ok)}.act-t{color:var(--b)}.req-t{color:var(--v)}
pre{background:#080d1e;padding:10px;border-radius:10px;overflow:auto;font-size:11px;max-height:280px}.big{font-size:26px;font-weight:700}.pass{color:var(--ok)}.fail{color:var(--r)}
.rq{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid rgba(130,160,255,.14)}.rq .i{flex:1;min-width:220px}
#toast{position:fixed;right:20px;bottom:20px;max-width:380px;padding:12px 16px;border-radius:12px;background:#16224a;border:1px solid var(--b);opacity:0;transition:.4s;pointer-events:none}#toast.s{opacity:1}
</style></head><body>
<header><h1>The Sleeping Campus<small>Occupancy-aware energy intelligence · every panel shares one live data stream</small></h1><span class="chip sim">SIMULATED · LOCAL ONLY</span><span id="clock" class="chip clk"></span>
<button id="pp" onclick="clk({play:!LV.play})">Pause</button><button onclick="clk({step:15})">1×</button><button onclick="clk({step:60})">4×</button><button onclick="clk({step:180})">12×</button><span class="sp"></span>
<span id="jp"></span><select id="role"><option>facility_manager</option><option>lab_admin</option><option>energy_manager</option><option>observer</option></select><button onclick="rst()">Reset demo</button></header>
<div id="kpi"></div><nav id="tabs"></nav><main id="main"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),api=(p,b)=>fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json());
const uid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>(Math.random()*16|0).toString(16));
let S,LV={hist:[],feed:[],requests:[],audit:[],ops:[],savings:[],hist2:[],forecast:{points:[],peak:{},by_building:{}},play:true},tab='twin',sel='A204',PV=null,N=0,CONC='';
const TABS={twin:'Live Campus',q:'Approval Queue',fc:'Forecast & Savings',conc:'Concurrency Lab',priv:'Privacy Centre',aud:'Audit'};
$('#tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}" onclick="tab='${k}';render()">${v}</button>`).join('');
$('#jp').innerHTML=[['morning','08:00'],['day','11:00'],['evening','19:00'],['night','02:00']].map(p=>`<button onclick="api('/api/phase',{phase:'${p[0]}'}).then(tick)">→${p[1]}</button>`).join('');
function toast(h){const t=$('#toast');t.innerHTML=h;t.className='s';clearTimeout(toast.x);toast.x=setTimeout(()=>t.className='',4200)}
const clk=b=>api('/api/clock',b).then(tick),rst=()=>api('/api/reset',{hour:11}).then(tick);
const go=id=>{sel=id;tab='twin';render()};
async function tick(){N++;LV=await api('/api/live');S=LV.state;if(tab=='priv'&&(!PV||N%4==0))PV=await api('/api/privacy');
 const h=parseInt(LV.clock);document.documentElement.style.setProperty('--day',Math.max(0,Math.sin((h-6)*Math.PI/12)).toFixed(2));
 $('#clock').textContent=(h>=6&&h<18?'☀ ':'🌙 ')+'SIM '+LV.clock+(LV.play?'':' ⏸');$('#pp').textContent=LV.play?'Pause':'Play';kpi();if(tab!='conc')draw()}
function kpi(){const t=S.totals,sc=t.sleep_score,C=2*Math.PI*24,col=sc>85?'#2ee6a6':sc>65?'#ffb02e':'#ff4d6d',pend=LV.requests.filter(r=>r.status=='pending'||r.status=='review').length;
 $('#kpi').innerHTML=`<div class="g k"><svg width="58" height="58"><circle cx="29" cy="29" r="24" fill="none" stroke="#1d2850" stroke-width="6"/><circle cx="29" cy="29" r="24" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*sc/100} ${C}" transform="rotate(-90 29 29)" style="transition:.8s"/><text x="29" y="34" text-anchor="middle" style="fill:#fff;font-size:15px;font-weight:700">${sc}</text></svg><div><small>SLEEP SCORE</small><b style="color:${col}">${sc>85?'Efficient':sc>65?'Leaking':'Wasteful'}</b></div></div>
 ${[['LIVE LOAD',t.kw+' kW','#fff'],['AVOIDABLE NOW',t.avoidable_kw+' kW','#ff4d6d'],['LEAK RATE','₹'+t.leak_inr_hr+'/h','#ffb02e'],['SAVED (SIMULATED)',t.measured_kwh_simulated.toFixed(2)+' kWh','#2ee6a6'],['AWAITING APPROVAL',pend,'#9b7bff']].map(k=>`<div class="g k"><div><small>${k[0]}</small><b style="color:${k[2]}">${k[1]}</b></div></div>`).join('')}`}
const colr=d=>d.state=='off'?'#3b4670':d.anomaly&&d.anomaly.level=='confirmed'?'#ff4d6d':d.anomaly?'#ffb02e':d.crit?'#4f8fe0':'#2ee6a6';
const POS={ACAD:[0,0],LAB:[3,0],LIB:[6,0],ADM:[0,3],HOST:[3,3],INFRA:[6,3]},T=38,P=(x,y,z)=>[(x-y)*T+260,(x+y)*T/2+70-z],pt=a=>a.map(q=>q.join(',')).join(' ');
function iso(){const it=[];Object.entries(POS).forEach(([b,[bx,by]])=>S.devices.filter(d=>d.bld==b).forEach((d,i)=>it.push([bx+i%2,by+(i>>1),d])));it.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])||a[0]-b[0]);
 let g=Object.entries(POS).map(([b,[x,y]])=>`<polygon points="${pt([P(x-.25,y-.25,0),P(x+2.25,y-.25,0),P(x+2.25,y+2.25,0),P(x-.25,y+2.25,0)])}" fill="#0e1636" stroke="#27356b"/><text x="${P(x+1,y+2.7,0)[0]}" y="${P(x+1,y+2.7,0)[1]}" text-anchor="middle">${S.buildings[b]}</text>`).join('');
 it.forEach(([x,y,d])=>{const h=6+d.pw*9,c=colr(d),A=P(x,y,h),B=P(x+1,y,h),C=P(x+1,y+1,h),D=P(x,y+1,h),B0=P(x+1,y,0),C0=P(x+1,y+1,0),D0=P(x,y+1,0),an=d.anomaly&&d.state=='on';
 g+=`<g class="cube ${an?(d.anomaly.level=='confirmed'?'glow':'glow2'):''}" onclick="sel='${d.id}';draw()"><title>${d.name}: ${d.pw} kW, ${d.occ} people, ${d.temp}C</title><polygon points="${pt([D,C,C0,D0])}" fill="${c}" style="filter:brightness(.62)"/><polygon points="${pt([B,C,C0,B0])}" fill="${c}" style="filter:brightness(.42)"/><polygon points="${pt([A,B,C,D])}" fill="${c}" stroke="${d.id==sel?'#fff':'#0b1020'}" stroke-width="${d.id==sel?2.5:1}"/>${d.crit?`<text x="${(A[0]+C[0])/2}" y="${(A[1]+C[1])/2+4}" text-anchor="middle" style="fill:#fff">🛡</text>`:''}</g>`});
 return `<svg viewBox="0 0 520 330" width="100%">${g}</svg>`}
function flow(){const b={};S.devices.forEach(d=>b[d.bld]=(b[d.bld]||0)+d.pw);const ks=Object.keys(S.buildings);
 return `<svg viewBox="0 0 520 160"><rect x="4" y="58" width="62" height="44" rx="10" fill="#1b2a5a" stroke="#3b5bdb"/><text x="35" y="84" text-anchor="middle" style="fill:#fff">GRID</text>${ks.map((k,i)=>{const y=14+i*26;return `<path d="M66 80 C150 80 150 ${y} 230 ${y}" class="fl" style="stroke-width:${1+b[k]/3.5}"/><text x="240" y="${y+4}">${S.buildings[k]}</text><text x="470" y="${y+4}" style="fill:#fff">${b[k].toFixed(1)} kW</text>`}).join('')}</svg>`}
const ln=(a,w,h,col,id)=>{if(a.length<2)return'<text x="10" y="20">collecting live data…</text>';const m=Math.max(...a.map(x=>x[1]),.1)*1.15,s=w/(a.length-1),p=a.map((x,i)=>`${(i*s).toFixed(1)},${(h-4-x[1]/m*(h-12)).toFixed(1)}`);
 return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".45"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${p.join(' ')} ${w},${h}" fill="url(#${id})"/><polyline points="${p.join(' ')}" fill="none" stroke="${col}" stroke-width="2.2"/><circle cx="${w}" cy="${p[p.length-1].split(',')[1]}" r="4" fill="${col}"/>`};
const feedH=()=>LV.feed.map(f=>`<div><span style="color:var(--m)">${f.t}</span> <span class="${f.lvl}-t">${f.msg}</span></div>`).join('')||'<div>Events appear here as the campus changes…</div>';
async function act(id,action,value){const d=S.devices.find(x=>x.id==id),r=await api('/api/command',{key:uid(),device:id,action,value,role:$('#role').value,version:d.ver});toast(`<b>${r.status.toUpperCase()}</b>: ${r.reason}`);tick()}
async function inj(room,kind){await api('/api/inject',{room,kind});tick()}
async function rq(id,dec){let note='';if(dec=='reject')note=prompt('Reason for rejecting?','Lab may still need cooling')||'no reason given';const r=await api('/api/request',{id,decision:dec,role:$('#role').value,note});toast(`<b>${r.status.toUpperCase()}</b>${r.idempotent_replay?' (idempotent replay)':''}: ${r.reason||''}`);tick()}
function detail(d){const a=d.anomaly;return `<h3 style="margin:0 0 8px">${d.name} <small style="color:var(--m)">v${d.ver}</small></h3><div class="kv"><span>Schedule</span><span>${d.status}</span><span>Expected / detected</span><span>${d.exp} / ${d.occ} people (aggregate)</span><span>Power / baseline</span><span>${d.pw} / ${d.basepw} kW</span><span>Temperature</span><span>${d.temp}°C</span><span>Device</span><span>${d.state}, setpoint ${d.setpoint}°C</span><span>Criticality</span><span>${d.crit?'🛡 PROTECTED':'non-critical'}</span></div>
 ${a?`<hr style="border-color:#27356b"><b>${a.level.toUpperCase()}: ${a.kind}</b> (${a.severity})<p>${a.reason}</p><p><b>Recommendation:</b> ${a.rec}</p>${a.est_kwh?`<p><span class="pill est">ESTIMATED</span> ${a.est_kwh} kWh ≈ ₹${a.est_inr}</p><p style="color:var(--m)">Comfort: ${a.comfort}<br>Safety: ${a.safety}</p>`:''}`:'<hr style="border-color:#27356b">No anomaly right now.'}
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="go" onclick="act('${d.id}','off')">Approve shutdown</button><button class="warn" onclick="act('${d.id}','setpoint',20)">Override: cool 20°C</button></div>`}
function twin(){const d=S.devices.find(x=>x.id==sel);return `<div class="two"><div><div class="g" style="margin-bottom:14px">${iso()}</div><div class="g"><small style="color:var(--m)">ENERGY FLOW · line thickness = live kW</small>${flow()}</div></div>
 <div><div class="g" style="margin-bottom:14px">${detail(d)}</div><div class="g" style="margin-bottom:14px"><small style="color:var(--m)">SCENARIO INJECTOR (simulated faults)</small><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button onclick="inj('LB3','ghost')">👻 Ghost load · Study Room</button><button onclick="inj('A101','ghost')">👻 Ghost load · A101</button><button class="no" onclick="inj('I1','heat')">🔥 Server-room cooling fault</button><button onclick="inj()">🧹 Clear</button></div></div>
 <div class="g feed"><small style="color:var(--m)">LIVE EVENT FEED</small>${feedH()}</div></div></div><div class="g"><small style="color:var(--m)">CAMPUS DEMAND · LIVE</small><svg viewBox="0 0 500 90" width="100%">${ln(LV.hist,500,90,'#5aa9ff','a1')}</svg></div>`}
function queue(){const open=LV.requests.filter(r=>r.status=='pending'||r.status=='review'),done=LV.requests.filter(r=>!(r.status=='pending'||r.status=='review')),nm=id=>S.devices.find(d=>d.id==id).name;
 return `<div class="g"><h3 style="margin-top:0">Autopilot proposals — nothing executes without a human approval</h3>${open.map(r=>`<div class="rq"><div class="i"><b onclick="go('${r.device}')" style="cursor:pointer;color:var(--b)">${nm(r.device)}</b> <span class="pill est">${r.status}</span><br><small style="color:var(--m)">${r.created} · based on device v${r.ver} · ${r.reason}</small></div><div><span class="pill est">EST.</span> ${r.est_kwh} kWh · ₹${(r.est_kwh*S.tariff).toFixed(0)}</div><button class="go" onclick="rq(${r.id},'approve')">Approve</button><button onclick="rq(${r.id},'review')">Request review</button><button class="no" onclick="rq(${r.id},'reject')">Reject</button></div>`).join('')||'<p style="color:var(--m)">No open proposals. Let the clock run, or inject a ghost load.</p>'}</div>
 <div class="g" style="margin-top:14px"><b>Decided</b><table><tr><th>#</th><th>room</th><th>status</th><th>by (demo role)</th><th>note</th></tr>${done.map(r=>`<tr class="cl" onclick="go('${r.device}')"><td>${r.id}</td><td>${nm(r.device)}</td><td>${r.status}</td><td>${r.decided_by||'-'}</td><td>${r.note||''}</td></tr>`).join('')}</table></div>`}
function fc(){const f=LV.forecast,m=Math.max(...f.points.map(p=>p.kw))*1.1,w=520/f.points.length,t=S.totals,bb=Object.entries(f.by_building||{}).sort((a,b)=>b[1]-a[1]),bm=bb.length?bb[0][1]:1;
 const bars=f.points.map((p,i)=>{const h=p.kw/m*150;return `<rect x="${i*w+6}" y="${170-h}" width="${w-12}" height="${h}" rx="5" fill="${p.hour==f.peak.hour?'#ff4d6d':i?'#5aa9ff':'#2ee6a6'}" opacity="${i?.8:1}"/><text x="${i*w+w/2}" y="188" text-anchor="middle">${String(p.hour).padStart(2,'0')}</text><text x="${i*w+w/2}" y="${164-h}" text-anchor="middle" style="fill:#fff">${Math.round(p.kw)}</text>`}).join('');
 const acc=op=>(op.baseline_kw-op.post_kw)*(LV.abs-op.t0)/60;
 return `<div class="two"><div class="g"><b>FORECAST (predicted, not measured)</b> · next 12 h · green = now, red = peak<svg viewBox="0 0 520 195" width="100%">${bars}</svg><p>${f.explanation}</p></div><div class="g"><b>Peak-hour load by building</b>${bb.map(([k,v])=>`<div style="margin:8px 0"><small>${S.buildings[k]} · ${v} kW</small><div style="height:8px;border-radius:6px;background:#17224f"><div style="height:8px;width:${v/bm*100}%;border-radius:6px;background:linear-gradient(90deg,#5aa9ff,#9b7bff)"></div></div></div>`).join('')}</div></div>
 <div class="two"><div class="g"><span class="pill mea">MEASURED (simulated post-action readings)</span> <b>accrued savings grow with simulated time</b><div class="big" style="color:var(--ok)">${t.measured_kwh_simulated.toFixed(2)} kWh</div><svg viewBox="0 0 500 110" width="100%">${ln(LV.hist2,500,110,'#2ee6a6','a2')}</svg></div>
 <div class="g"><span class="pill est">ESTIMATED</span> projection when approved: <div class="big" style="color:var(--w)">${t.est_kwh} kWh · ₹${t.est_inr}</div><p style="color:var(--m)">Interventions: ${t.interventions} · rejected/conflicting/unsafe: ${t.rejected}. Simulated data only - not real-world savings.</p></div></div>
 <div class="g"><table><tr><th>room</th><th>baseline→post kW</th><th>estimated kWh</th><th>measured so far (sim)</th></tr>${LV.savings.map(o=>`<tr class="cl" onclick="go('${o.device}')"><td>${o.device}</td><td>${o.baseline_kw} → ${o.post_kw}</td><td>${o.est_kwh}</td><td style="color:var(--ok)">${acc(o).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan="4">No approved actions yet - approve a proposal in the queue.</td></tr>'}</table></div>`}
function conc(){return `<div class="g"><p>Real concurrent threads against the SQLite-backed API (each run resets the demo first).</p>${[['duplicate','Duplicate attack ×10'],['conflict','Conflicting admins'],['stale','Stale version'],['unsafe','Unsafe server-room shutdown']].map(b=>`<button onclick="runDemo('${b[0]}')">${b[1]}</button>`).join(' ')}<div id="out">${CONC}</div></div>`}
async function runDemo(k){$('#out').innerHTML='<pre>running…</pre>';const r=await api('/api/demo/'+k,{}),{results,...rest}=r;CONC=`<h3>${r.title}</h3><pre>${JSON.stringify(rest,null,2)}</pre>${results?`<table><tr><th>#</th><th>role</th><th>action</th><th>status</th><th></th><th>reason</th></tr>${results.map((x,i)=>`<tr><td>${i+1}</td><td>${x.role}</td><td>${x.action}</td><td>${x.status}</td><td>${x.idempotent_replay?'idempotent duplicate':''}</td><td>${x.reason}</td></tr>`).join('')}</table>`:''}`;$('#out').innerHTML=CONC;tick()}
function priv(){const e=performance.getEntriesByType('resource'),ext=e.filter(x=>new URL(x.name).origin!=location.origin),f=e.filter(x=>x.initiatorType=='fetch').length;
 return `<div class="two"><div class="g"><h3 style="margin-top:0">Server-side checks ${PV?`<span class="${PV.all_passed?'pass':'fail'}">${PV.all_passed?'ALL PASSED':'FAILED'}</span>`:''}</h3><table>${PV?PV.checks.map(c=>`<tr><td>${c.name}</td><td class="${c.passed?'pass':'fail'}">${c.passed?'PASS':'FAIL'}</td></tr>`).join(''):'<tr><td>running…</td></tr>'}</table><p style="color:var(--m)">${PV?PV.notes:''}</p></div>
 <div class="g"><h3 style="margin-top:0">Live browser network audit</h3><div class="big ${ext.length?'fail':'pass'}">${ext.length} external requests</div><p>${e.length} resources loaded, ${f} live API calls this session - all to <code>${location.host}</code>.</p><pre>Browser ⇄ 127.0.0.1 server ⇄ SQLite\nNo CDN · no analytics · no cloud AI\nStored: aggregate occupant counts only\nExcluded: names, IDs, MACs, movement</pre></div></div>`}
function aud(){return `<div class="g"><b>Audit history</b> - one entry per unique operation; duplicates only increment a counter. Click a row to open the room.<table><tr><th>time</th><th>room</th><th>demo role</th><th>action</th><th>outcome</th><th>reason</th></tr>${LV.audit.map(x=>`<tr class="cl" onclick="go('${x.device}')"><td>${x.ts.slice(11)}</td><td>${x.device}</td><td>${x.role}</td><td>${x.action}</td><td>${x.outcome}</td><td>${x.reason}</td></tr>`).join('')}</table></div><div class="g" style="margin-top:14px"><b>Idempotency keys</b><table><tr><th>key</th><th>room</th><th>based on</th><th>status</th><th>duplicates absorbed</th></tr>${LV.ops.map(x=>`<tr><td>${x.key.slice(0,13)}…</td><td>${x.device}</td><td>v${x.base_ver}</td><td>${x.status}</td><td>${x.dups}</td></tr>`).join('')}</table></div>`}
function draw(){if(!S)return;document.querySelectorAll('#tabs button').forEach(b=>b.className=b.dataset.t==tab?'on':'');$('#main').innerHTML=({twin,q:queue,fc,conc,priv,aud})[tab]()}
function render(){if(tab=='priv')PV=null;draw();if(tab=='priv')tick()}
tick();setInterval(tick,1500);
</script></body></html>
